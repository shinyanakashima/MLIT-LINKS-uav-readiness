<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>防災・災害対応ドローン即応リソースマップ</title>
  <meta name="description" content="国土交通省 Project LINKS の無人航空機飛行計画データから、夜間・目視外に対応した災害対応ドローン運用の地域分布（即応度）を推定して可視化します。" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>防災・災害対応<br>ドローン即応リソースマップ</h1>
        <p class="lead">夜間・目視外に対応した「災害対応」ドローン運用が、どの地域にどれだけ分布しているかの<strong>推定</strong>。</p>
      </header>

      <section class="panel">
        <h2>表示する指標</h2>
        <div id="metric-group" class="radio-group">
          <label><input type="radio" name="metric" value="score" checked> 即応度スコア</label>
          <label><input type="radio" name="metric" value="full"> 完全対応（夜間×目視外）</label>
          <label><input type="radio" name="metric" value="night"> 夜間対応</label>
          <label><input type="radio" name="metric" value="bvlos"> 目視外対応</label>
          <label><input type="radio" name="metric" value="disaster"> 災害対応 計画数</label>
        </div>
        <p class="hint" id="metric-hint"></p>
      </section>

      <section class="panel">
        <h2>能力フィルタ</h2>
        <div class="check-group">
          <label><input type="checkbox" id="f-night"> 夜間対応あり</label>
          <label><input type="checkbox" id="f-bvlos"> 目視外対応あり</label>
          <label><input type="checkbox" id="f-full"> 完全対応あり（夜間×目視外）</label>
        </div>
        <div class="select-row">
          <label for="pref-select">都道府県</label>
          <select id="pref-select"><option value="">すべて</option></select>
        </div>
        <div class="select-row">
          <label for="kind-select">機体の種類</label>
          <select id="kind-select"><option value="">すべて</option></select>
        </div>
        <div class="check-group">
          <label><input type="checkbox" id="f-tokachi"> 北海道・十勝管内のみ</label>
        </div>
        <button id="reset-btn" type="button">フィルタをリセット</button>
      </section>

      <section class="panel" id="stats-panel">
        <h2>集計サマリ</h2>
        <div id="stats"></div>
      </section>

      <section class="panel" id="rank-panel">
        <h2>即応度ランキング <span id="rank-count" class="muted"></span></h2>
        <ol id="ranking"></ol>
      </section>

      <footer>
        <section class="panel notice">
          <h2>ご利用にあたって</h2>
          <p id="disclaimer"></p>
          <p class="src" id="attribution"></p>
          <p class="src">本マップは飛行計画（申請）ベースの推定であり、実際の出動可能性・実飛行・各事業者の実態を保証するものではありません。災害協定等の検討にあたっては一次情報での確認をお願いします。</p>
        </section>
      </footer>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>
      <div id="legend" class="leaflet-control"></div>
      <div id="loading">データを読み込み中…</div>
    </main>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
