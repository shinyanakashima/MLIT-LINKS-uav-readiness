<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>防災・災害対応ドローン即応リソースマップ</title>
  <meta name="description" content="国土交通省 Project LINKS の無人航空機飛行計画データから、夜間・目視外に対応した災害対応ドローン運用の地域分布（即応度）を推定して可視化します。" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <div id="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="ja" class="active">日本語</button>
          <button type="button" data-lang="en">English</button>
        </div>
        <h1 data-i18n="title"></h1>
        <p class="lead" data-i18n-html="lead"></p>
      </header>

      <section class="panel">
        <h2 data-i18n="h_metric"></h2>
        <div id="metric-group" class="radio-group">
          <label><input type="radio" name="metric" value="score" checked> <span data-i18n="m_score"></span></label>
          <label><input type="radio" name="metric" value="full"> <span data-i18n="m_full"></span></label>
          <label><input type="radio" name="metric" value="night"> <span data-i18n="m_night"></span></label>
          <label><input type="radio" name="metric" value="bvlos"> <span data-i18n="m_bvlos"></span></label>
          <label><input type="radio" name="metric" value="disaster"> <span data-i18n="m_disaster"></span></label>
        </div>
        <p class="hint" id="metric-hint"></p>
      </section>

      <section class="panel">
        <h2 data-i18n="h_filter"></h2>
        <div class="check-group">
          <label><input type="checkbox" id="f-night"> <span data-i18n="f_night"></span></label>
          <label><input type="checkbox" id="f-bvlos"> <span data-i18n="f_bvlos"></span></label>
          <label><input type="checkbox" id="f-full"> <span data-i18n="f_full"></span></label>
        </div>
        <div class="select-row">
          <label for="pref-select" data-i18n="l_pref"></label>
          <select id="pref-select"></select>
        </div>
        <div class="select-row">
          <label for="kind-select" data-i18n="l_kind"></label>
          <select id="kind-select"></select>
        </div>
        <div class="check-group">
          <label><input type="checkbox" id="f-tokachi"> <span data-i18n="f_tokachi"></span></label>
        </div>
        <button id="reset-btn" type="button" data-i18n="reset"></button>
      </section>

      <section class="panel" id="stats-panel">
        <h2 data-i18n="h_stats"></h2>
        <div id="stats"></div>
      </section>

      <section class="panel" id="rank-panel">
        <h2><span data-i18n="h_rank"></span> <span id="rank-count" class="muted"></span></h2>
        <ol id="ranking"></ol>
      </section>

      <footer>
        <section class="panel notice">
          <h2 data-i18n="h_notice"></h2>
          <p id="disclaimer"></p>
          <p class="src" id="attribution"></p>
          <p class="src" data-i18n="static_disclaimer"></p>
        </section>
      </footer>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>
      <div id="legend" class="leaflet-control"></div>
      <div id="loading" data-i18n="loading"></div>
    </main>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
